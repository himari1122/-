<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="はむカルテ">
<title>はむカルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEBDF;
    --panel:#FBFAF4;
    --panel-edge:#E4E1D2;
    --ink:#2B3A42;
    --ink-soft:#63737A;
    --ink-faint:#96A3A8;
    --accent:#3E5C63;
    --accent-soft:#DCE4E1;
    --line:#D9D3BF;
    --stamp-dx:#A6403F;
    --stamp-tx:#3E5C63;
    --stamp-dy:#6E8A55;
    --stamp-ot:#8A7A4E;
    --danger:#A6403F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Shippori Mincho', serif;}
  img{ -webkit-user-drag:none; }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  header.top{
    position:sticky; top:0; z-index:10;
    padding:16px 18px 10px;
    background:rgba(234,235,223,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--panel-edge);
  }
  header.top h1{
    font-size:19px;
    letter-spacing:.1em;
    margin:0 0 2px;
    font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  header.top h1 span.dot{
    display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--stamp-dx);
  }
  header.top .sub{ font-size:11px; color:var(--ink-soft); letter-spacing:.06em; }

  /* ---- avatar strip ---- */
  .avatar-strip{
    position:sticky; top:56px; z-index:9;
    display:flex; gap:14px;
    padding:14px 18px;
    overflow-x:auto;
    background:rgba(234,235,223,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--panel-edge);
    scrollbar-width:none;
  }
  .avatar-strip::-webkit-scrollbar{ display:none; }
  .avatar-item{
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    width:56px;
    cursor:pointer;
    opacity:.6;
  }
  .avatar-item.active{ opacity:1; }
  .avatar-circle{
    width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    background-size:cover; background-position:center;
    border:2px solid transparent;
  }
  .avatar-item.active .avatar-circle{ border-color:var(--ink); }
  .avatar-item .name{
    font-size:10.5px; color:var(--ink-soft); max-width:56px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .avatar-item.active .name{ color:var(--ink); font-weight:700; }
  .avatar-add{
    flex-shrink:0;
    width:48px;height:48px;border-radius:50%;
    border:1.5px dashed var(--ink-faint);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft); font-size:20px; cursor:pointer;
    background:transparent;
  }
  .avatar-add-wrap{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .avatar-add-wrap .name{ font-size:10.5px; color:var(--ink-soft); }

  main.karte{
    flex:1;
    padding:18px 18px 90px;
  }
  .empty-state{
    padding:60px 12px; text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.9;
  }

  .profile-card{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    padding:18px 16px;
    box-shadow:0 6px 20px rgba(43,58,66,.06);
    margin-bottom:20px;
  }
  .profile-top{ display:flex; gap:14px; align-items:center; }
  .face-photo{
    width:66px;height:66px;border-radius:50%;
    background-size:cover; background-position:center;
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Shippori Mincho',serif; font-weight:700; font-size:20px;
    flex-shrink:0;
  }
  .profile-name-row h2{
    font-size:21px; margin:0 0 4px; font-weight:800;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .gender-badge{
    font-size:12px; padding:2px 8px; border-radius:20px;
    background:var(--accent-soft); color:var(--accent); font-weight:700;
  }
  .profile-meta{
    font-size:12px; color:var(--ink-soft);
    display:flex; flex-direction:column; gap:2px;
  }
  .profile-actions{
    display:flex; gap:8px; margin-top:14px;
  }
  .icon-btn{
    flex:1;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
    border-radius:9px; padding:9px 10px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }

  .section-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  .section-head h3{ font-size:12.5px; letter-spacing:.1em; color:var(--ink-soft); margin:0; font-weight:700; }
  .primary-btn{
    background:var(--ink); color:#fff; border:none; border-radius:9px;
    padding:10px 16px; font-size:13px; cursor:pointer; font-family:inherit; width:100%;
  }
  .primary-btn:hover{ background:var(--accent); }

  .timeline{ display:flex; flex-direction:column; }
  .entry{
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .entry:last-child{ border-bottom:none; }
  .stamp{
    width:34px;height:34px;flex-shrink:0;
    border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:13px;
    transform:rotate(-6deg);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 2px 4px rgba(43,58,66,.18);
    margin-top:2px;
  }
  .stamp.dx{ background:var(--stamp-dx); }
  .stamp.tx{ background:var(--stamp-tx); }
  .stamp.dy{ background:var(--stamp-dy); }
  .stamp.ot{ background:var(--stamp-ot); }
  .entry-body{ flex:1; min-width:0; }
  .entry-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .entry-date{ font-size:11.5px; color:var(--ink-faint); }
  .entry-type{ font-size:11px; color:var(--ink-soft); }
  .entry-title{ font-size:14.5px; font-weight:700; margin:3px 0 0; }
  .entry-note{ font-size:12.5px; color:var(--ink-soft); margin:5px 0 0; line-height:1.7; white-space:pre-wrap; }
  .entry-photo{
    margin-top:8px; width:100%; max-width:220px; border-radius:10px;
    overflow:hidden; cursor:pointer; background:var(--accent-soft);
    aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
  }
  .entry-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .entry-photo .ph-loading{ font-size:11px; color:var(--ink-soft); }
  .entry-actions{ display:flex; gap:10px; margin-top:8px; }
  .entry-actions button{
    background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:12px;font-family:inherit;padding:0;
  }
  .entry-actions button:hover{ color:var(--ink); }

  .fab{
    position:fixed;
    left:50%; transform:translateX(calc(-50% + 190px));
    bottom:22px;
    width:52px;height:52px;border-radius:50%;
    background:var(--ink); color:#fff; border:none;
    font-size:24px; cursor:pointer;
    box-shadow:0 8px 20px rgba(43,58,66,.28);
    z-index:8;
    display:flex; align-items:center; justify-content:center;
  }
  @media (max-width:480px){
    .fab{ transform:none; right:18px; left:auto; }
  }

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,58,66,.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal{
    background:var(--panel); border-radius:18px 18px 0 0; padding:22px 20px 26px;
    width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    box-shadow:0 -10px 40px rgba(43,58,66,.25);
  }
  @media (min-width:540px){
    .overlay{ align-items:center; }
    .modal{ border-radius:16px; max-width:420px; }
  }
  .modal h3{ margin:0 0 16px; font-family:'Shippori Mincho',serif; font-size:18px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .field textarea{ min-height:66px; resize:vertical; }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent; }
  .swatch.selected{ border-color:var(--ink); }

  .photo-picker{
    display:flex; align-items:center; gap:12px;
  }
  .photo-preview{
    width:64px;height:64px;border-radius:12px;background:var(--accent-soft);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:11px; flex-shrink:0; overflow:hidden;
  }
  .photo-preview.round{ border-radius:50%; }
  .photo-buttons{ display:flex; flex-direction:column; gap:6px; }
  .photo-buttons label, .photo-buttons button{
    font-size:12px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:7px; padding:6px 10px; cursor:pointer; text-align:center; font-family:inherit;
  }
  .photo-buttons label:hover, .photo-buttons button:hover{ color:var(--ink); }
  input[type=file]{ display:none; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .ghost-btn{
    background:none; border:1px solid var(--line); border-radius:8px; padding:9px 15px;
    font-size:13px; cursor:pointer; color:var(--ink-soft); font-family:inherit;
  }
  .ghost-btn:hover{ color:var(--ink); }

  .lightbox{
    position:fixed; inset:0; background:rgba(20,26,29,.92); z-index:70;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }
  .lightbox-close{
    position:absolute; top:18px; right:18px; background:rgba(255,255,255,.15);
    color:#fff; border:none; border-radius:50%; width:36px;height:36px; font-size:18px; cursor:pointer;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; z-index:80; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div>
        <h1 class="display"><span class="dot"></span>はむカルテ</h1>
        <div class="sub">個体ごとの記録帳</div>
      </div>
      <button id="backupBtn" style="flex-shrink:0; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:15px; color:var(--ink-soft); cursor:pointer;">⚙</button>
    </div>
  </header>
  <nav class="avatar-strip" id="avatarStrip"></nav>
  <main class="karte" id="karte"></main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
const SWATCHES = [
  {label:'あんみつ色', hex:'#E3A272'},
  {label:'抹茶色',     hex:'#8FA876'},
  {label:'小豆色',     hex:'#8B4B4F'},
  {label:'牛乳寒天',   hex:'#B9C7CB'},
  {label:'黒糖',       hex:'#6B4A3A'},
  {label:'桜色',       hex:'#E7B6BE'},
];
const TYPES = {
  dx:{label:'診断・発症', short:'病'},
  tx:{label:'治療開始',   short:'薬'},
  dy:{label:'日記',       short:'記'},
  ot:{label:'その他',     short:'他'},
};

let hamsterIndex = [];
let currentId = null;
let currentHamster = null;
let cache = {};
let pendingFacePhoto = null;   // {thumb, full} while editing hamster form
let pendingEntryPhoto = null;  // dataURL while editing entry form
let pendingEntryPhotoRemoved = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function safeGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
async function safeSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ toast('保存に失敗しました…もう一度お試しください'); return false; }
}
async function safeDelete(key){
  try{ localStorage.removeItem(key); return true; }
  catch(e){ return false; }
}

async function loadIndex(){
  const raw = await safeGet('hamster-index');
  hamsterIndex = raw ? JSON.parse(raw) : [];
}
async function saveIndex(){ await safeSet('hamster-index', JSON.stringify(hamsterIndex)); }

async function loadHamster(id){
  if(cache[id]) return cache[id];
  const raw = await safeGet('hamster:'+id);
  if(!raw) return null;
  const h = JSON.parse(raw);
  if(!h.entries) h.entries = [];
  cache[id] = h;
  return h;
}
async function saveHamster(h){
  cache[h.id] = h;
  await safeSet('hamster:'+h.id, JSON.stringify(h));
}

/* ---------- image helpers ---------- */
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width,height} = img;
      if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
      else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function ageText(birthdate){
  if(!birthdate) return null;
  const b = new Date(birthdate+'T00:00:00');
  const now = new Date();
  if(isNaN(b.getTime())) return null;
  let days = Math.floor((now-b)/86400000);
  if(days < 0) return null;
  const years = Math.floor(days/365);
  const months = Math.floor((days%365)/30);
  if(years === 0 && months === 0) return `生後${days}日`;
  if(years === 0) return `生後${months}ヶ月`;
  return `生後${years}歳${months}ヶ月`;
}
function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${y}.${m}.${day}`;
}
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- avatar strip ---------- */
function renderAvatarStrip(){
  const el = document.getElementById('avatarStrip');
  el.innerHTML = '';
  hamsterIndex.forEach(h=>{
    const item = document.createElement('div');
    item.className = 'avatar-item' + (h.id===currentId ? ' active':'');
    const bg = h.avatar ? `background-image:url(${h.avatar})` : `background:${h.color}`;
    item.innerHTML = `
      <div class="avatar-circle" style="${bg}">${h.avatar ? '' : escapeHtml(h.name.slice(0,1))}</div>
      <div class="name">${escapeHtml(h.name)}</div>
    `;
    item.onclick = ()=>selectHamster(h.id);
    el.appendChild(item);
  });
  const addWrap = document.createElement('div');
  addWrap.className = 'avatar-add-wrap';
  addWrap.innerHTML = `<div class="avatar-add">＋</div><div class="name">新規</div>`;
  addWrap.onclick = openAddHamsterModal;
  el.appendChild(addWrap);
}

async function selectHamster(id){
  currentId = id;
  renderAvatarStrip();
  currentHamster = await loadHamster(id);
  renderKarte();
}

/* ---------- karte main ---------- */
function renderKarte(){
  const el = document.getElementById('karte');
  const oldFab = document.querySelector('.fab');
  if(oldFab) oldFab.remove();

  if(!currentHamster){
    el.innerHTML = `<div class="empty-state">まだ登録された仔がいません。<br>上の「＋ 新規」から最初の1匹を追加してください。</div>`;
    return;
  }
  const h = currentHamster;
  const genderLabel = h.gender === 'female' ? '♀ 女の子' : h.gender === 'male' ? '♂ 男の子' : '性別不明';
  const age = ageText(h.birthdate);
  const faceBg = h.facePhoto ? `background-image:url(${h.facePhoto})` : `background:${h.color}`;

  el.innerHTML = `
    <div class="profile-card">
      <div class="profile-top">
        <div class="face-photo" style="${faceBg}">${h.facePhoto ? '' : escapeHtml(h.name.slice(0,1))}</div>
        <div class="profile-name-row">
          <h2 class="display">${escapeHtml(h.name)} <span class="gender-badge">${genderLabel}</span></h2>
          <div class="profile-meta">
            ${h.birthdate ? `<span>生年月日: ${fmtDate(h.birthdate)}</span>`:''}
            ${age ? `<span>${age}</span>`:''}
            ${h.furColor ? `<span>毛色: ${escapeHtml(h.furColor)}</span>`:''}
            ${h.memo ? `<span>${escapeHtml(h.memo)}</span>`:''}
          </div>
        </div>
      </div>
      <div class="profile-actions">
        <button class="icon-btn" id="editHamsterBtn">プロフィール編集</button>
        <button class="icon-btn danger" id="deleteHamsterBtn">削除</button>
      </div>
    </div>
    <div class="section-head">
      <h3>記録タイムライン</h3>
    </div>
    <div class="timeline" id="timeline"></div>
  `;

  document.getElementById('editHamsterBtn').onclick = ()=>openEditHamsterModal(h);
  document.getElementById('deleteHamsterBtn').onclick = ()=>confirmDeleteHamster(h);

  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '＋';
  fab.title = '記録を追加';
  fab.onclick = ()=>openEntryModal(h);
  document.getElementById('app').appendChild(fab);

  const tl = document.getElementById('timeline');
  if(!h.entries.length){
    tl.innerHTML = `<div class="empty-state">まだ記録がありません。右下の＋から診断日・治療開始日・日記などを追加してみましょう。</div>`;
    return;
  }
  const sorted = [...h.entries].sort((a,b)=> b.date.localeCompare(a.date));
  tl.innerHTML = '';
  sorted.forEach(entry=>{
    const t = TYPES[entry.type] || TYPES.ot;
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <div class="stamp ${entry.type}">${t.short}</div>
      <div class="entry-body">
        <div class="entry-top">
          <span class="entry-date">${fmtDate(entry.date)}</span>
          <span class="entry-type">${t.label}</span>
        </div>
        <div class="entry-title">${escapeHtml(entry.title)}</div>
        ${entry.note ? `<div class="entry-note">${escapeHtml(entry.note)}</div>`:''}
        ${entry.hasPhoto ? `<div class="entry-photo" data-eid="${entry.id}"><span class="ph-loading">写真を読込中…</span></div>` : ''}
        <div class="entry-actions">
          <button data-act="edit">編集</button>
          <button data-act="del">削除</button>
        </div>
      </div>
    `;
    row.querySelector('[data-act="edit"]').onclick = ()=>openEntryModal(h, entry);
    row.querySelector('[data-act="del"]').onclick = ()=>confirmDeleteEntry(h, entry);
    tl.appendChild(row);
  });

  // lazy-load photos for entries that have one
  sorted.filter(e=>e.hasPhoto).forEach(async entry=>{
    const raw = await safeGet(`photo:${h.id}:${entry.id}`);
    const box = tl.querySelector(`.entry-photo[data-eid="${entry.id}"]`);
    if(!box) return;
    if(raw){
      box.innerHTML = `<img src="${raw}" alt="${escapeHtml(entry.title)}">`;
      box.onclick = ()=>openLightbox(raw);
    } else {
      box.innerHTML = `<span class="ph-loading">写真を読み込めませんでした</span>`;
    }
  });
}

/* ---------- lightbox ---------- */
function openLightbox(src){
  const root = document.getElementById('modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'lightbox';
  wrap.innerHTML = `<button class="lightbox-close">✕</button><img src="${src}">`;
  wrap.onclick = (e)=>{ if(e.target===wrap || e.target.classList.contains('lightbox-close')) wrap.remove(); };
  root.appendChild(wrap);
}

/* ---------- modals ---------- */
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function openAddHamsterModal(){ renderHamsterForm(null); }
function openEditHamsterModal(h){ renderHamsterForm(h); }

function renderHamsterForm(existing){
  pendingFacePhoto = null;
  const root = document.getElementById('modal-root');
  const chosenColor = existing ? existing.color : SWATCHES[0].hex;
  const previewBg = existing && existing.facePhoto ? `background-image:url(${existing.facePhoto})` : '';

  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3 class="display">${existing? 'プロフィールを編集':'新しい仔を登録'}</h3>

        <div class="field">
          <label>顔写真</label>
          <div class="photo-picker">
            <div class="photo-preview round" id="facePreview" style="${previewBg}">${previewBg?'':'なし'}</div>
            <div class="photo-buttons">
              <label for="faceInput">写真を選ぶ</label>
              <input type="file" id="faceInput" accept="image/*">
              <button type="button" id="faceRemoveBtn">写真を削除</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label>名前</label>
          <input type="text" id="f-name" value="${existing?escapeHtml(existing.name):''}" placeholder="例）あんみつ">
        </div>
        <div class="field">
          <label>性別</label>
          <select id="f-gender">
            <option value="female" ${existing&&existing.gender==='female'?'selected':''}>女の子</option>
            <option value="male" ${existing&&existing.gender==='male'?'selected':''}>男の子</option>
            <option value="unknown" ${(!existing||existing.gender==='unknown')?'selected':''}>不明</option>
          </select>
        </div>
        <div class="field">
          <label>生年月日</label>
          <input type="date" id="f-birthdate" value="${existing&&existing.birthdate?existing.birthdate:''}">
        </div>
        <div class="field">
          <label>毛色</label>
          <input type="text" id="f-furcolor" value="${existing&&existing.furColor?escapeHtml(existing.furColor):''}" placeholder="例）キンクマ、ノーマル、パールホワイトなど">
        </div>
        <div class="field">
          <label>タブの色</label>
          <div class="swatches" id="f-swatches">
            ${SWATCHES.map(s=>`<div class="swatch${s.hex===chosenColor?' selected':''}" style="background:${s.hex}" data-hex="${s.hex}" title="${s.label}"></div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>メモ（血統・特徴など任意）</label>
          <input type="text" id="f-memo" value="${existing&&existing.memo?escapeHtml(existing.memo):''}" placeholder="例）フィアンティーヌの仔">
        </div>
        <div class="modal-actions">
          <button class="ghost-btn" id="cancelBtn">キャンセル</button>
          <button class="primary-btn" style="width:auto" id="saveBtn">保存</button>
        </div>
      </div>
    </div>
  `;
  let selectedHex = chosenColor;
  let faceRemoved = false;

  root.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=>{
      root.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      selectedHex = sw.dataset.hex;
    };
  });

  document.getElementById('faceInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    toast('写真を処理中…');
    const raw = await readFileAsDataUrl(file);
    const [thumb, full] = await Promise.all([
      resizeDataUrl(raw, 96, 0.7),
      resizeDataUrl(raw, 480, 0.75)
    ]);
    pendingFacePhoto = {thumb, full};
    faceRemoved = false;
    const prev = document.getElementById('facePreview');
    prev.style.backgroundImage = `url(${full})`;
    prev.textContent = '';
  };
  document.getElementById('faceRemoveBtn').onclick = ()=>{
    pendingFacePhoto = null;
    faceRemoved = true;
    const prev = document.getElementById('facePreview');
    prev.style.backgroundImage = '';
    prev.textContent = 'なし';
  };

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ toast('名前を入力してください'); return; }
    const gender = document.getElementById('f-gender').value;
    const birthdate = document.getElementById('f-birthdate').value;
    const furColor = document.getElementById('f-furcolor').value.trim();
    const memo = document.getElementById('f-memo').value.trim();

    if(existing){
      existing.name = name; existing.gender = gender; existing.birthdate = birthdate;
      existing.color = selectedHex; existing.memo = memo; existing.furColor = furColor;
      if(pendingFacePhoto){ existing.facePhoto = pendingFacePhoto.full; }
      else if(faceRemoved){ existing.facePhoto = null; }
      await saveHamster(existing);
      const idxItem = hamsterIndex.find(x=>x.id===existing.id);
      idxItem.name = name; idxItem.gender = gender; idxItem.color = selectedHex;
      if(pendingFacePhoto){ idxItem.avatar = pendingFacePhoto.thumb; }
      else if(faceRemoved){ idxItem.avatar = null; }
      await saveIndex();
      currentHamster = existing;
    } else {
      const id = uid();
      const h = {id, name, gender, birthdate, furColor, color:selectedHex, memo, entries:[],
        facePhoto: pendingFacePhoto ? pendingFacePhoto.full : null};
      await saveHamster(h);
      hamsterIndex.push({id, name, gender, color:selectedHex, avatar: pendingFacePhoto ? pendingFacePhoto.thumb : null});
      await saveIndex();
      currentId = id;
      currentHamster = h;
    }
    closeModal();
    renderAvatarStrip();
    renderKarte();
    toast('保存しました');
  };
}

function confirmDeleteHamster(h){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3 class="display">${escapeHtml(h.name)}を削除しますか？</h3>
        <p style="font-size:13px;color:var(--ink-soft);">記録・写真もすべて削除され、元に戻せません。</p>
        <div class="modal-actions">
          <button class="ghost-btn" id="cancelBtn">キャンセル</button>
          <button class="primary-btn" style="width:auto;background:var(--danger)" id="okBtn">削除する</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  document.getElementById('okBtn').onclick = async ()=>{
    for(const entry of h.entries){
      if(entry.hasPhoto) await safeDelete(`photo:${h.id}:${entry.id}`);
    }
    await safeDelete('hamster:'+h.id);
    delete cache[h.id];
    hamsterIndex = hamsterIndex.filter(x=>x.id!==h.id);
    await saveIndex();
    closeModal();
    if(currentId === h.id){
      currentId = hamsterIndex[0] ? hamsterIndex[0].id : null;
      currentHamster = currentId ? await loadHamster(currentId) : null;
    }
    renderAvatarStrip();
    renderKarte();
    toast('削除しました');
  };
}

function openEntryModal(h, existing){
  pendingEntryPhoto = null;
  pendingEntryPhotoRemoved = false;
  const root = document.getElementById('modal-root');
  const today = new Date().toISOString().slice(0,10);
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3 class="display">${existing?'記録を編集':'記録を追加'}</h3>
        <div class="field">
          <label>日付</label>
          <input type="date" id="f-date" value="${existing?existing.date:today}">
        </div>
        <div class="field">
          <label>種類</label>
          <select id="f-type">
            ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${existing&&existing.type===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>タイトル</label>
          <input type="text" id="f-title" value="${existing?escapeHtml(existing.title):''}" placeholder="例）尿糖検出 / ケージ内の様子">
        </div>
        <div class="field">
          <label>メモ（任意）</label>
          <textarea id="f-note" placeholder="経過や気づいたことなど">${existing&&existing.note?escapeHtml(existing.note):''}</textarea>
        </div>
        <div class="field">
          <label>写真（任意・ケージの様子や患部など）</label>
          <div class="photo-picker">
            <div class="photo-preview" id="entryPreview">${existing&&existing.hasPhoto ? '読込中…' : 'なし'}</div>
            <div class="photo-buttons">
              <label for="entryPhotoInput">写真を選ぶ</label>
              <input type="file" id="entryPhotoInput" accept="image/*">
              <button type="button" id="entryPhotoRemoveBtn">写真を削除</button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="ghost-btn" id="cancelBtn">キャンセル</button>
          <button class="primary-btn" style="width:auto" id="saveBtn">保存</button>
        </div>
      </div>
    </div>
  `;

  if(existing && existing.hasPhoto){
    safeGet(`photo:${h.id}:${existing.id}`).then(raw=>{
      const prev = document.getElementById('entryPreview');
      if(!prev) return;
      if(raw){ prev.style.backgroundImage = `url(${raw})`; prev.textContent=''; }
      else { prev.textContent = '読込エラー'; }
    });
  }

  document.getElementById('entryPhotoInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    toast('写真を処理中…');
    const raw = await readFileAsDataUrl(file);
    const resized = await resizeDataUrl(raw, 900, 0.72);
    pendingEntryPhoto = resized;
    pendingEntryPhotoRemoved = false;
    const prev = document.getElementById('entryPreview');
    prev.style.backgroundImage = `url(${resized})`;
    prev.textContent = '';
  };
  document.getElementById('entryPhotoRemoveBtn').onclick = ()=>{
    pendingEntryPhoto = null;
    pendingEntryPhotoRemoved = true;
    const prev = document.getElementById('entryPreview');
    prev.style.backgroundImage = '';
    prev.textContent = 'なし';
  };

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  document.getElementById('saveBtn').onclick = async ()=>{
    const date = document.getElementById('f-date').value;
    const type = document.getElementById('f-type').value;
    const title = document.getElementById('f-title').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if(!date){ toast('日付を入力してください'); return; }
    if(!title){ toast('タイトルを入力してください'); return; }

    let entryId;
    if(existing){
      entryId = existing.id;
      existing.date = date; existing.type = type; existing.title = title; existing.note = note;
      if(pendingEntryPhoto){ existing.hasPhoto = true; }
      else if(pendingEntryPhotoRemoved){ existing.hasPhoto = false; }
    } else {
      entryId = uid();
      const newEntry = {id:entryId, date, type, title, note, hasPhoto: !!pendingEntryPhoto};
      h.entries.push(newEntry);
    }

    if(pendingEntryPhoto){
      await safeSet(`photo:${h.id}:${entryId}`, pendingEntryPhoto);
    } else if(pendingEntryPhotoRemoved){
      await safeDelete(`photo:${h.id}:${entryId}`);
    }

    await saveHamster(h);
    closeModal();
    renderKarte();
    toast('保存しました');
  };
}

function confirmDeleteEntry(h, entry){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3 class="display">この記録を削除しますか？</h3>
        <p style="font-size:13px;color:var(--ink-soft);">「${escapeHtml(entry.title)}」（${fmtDate(entry.date)}）</p>
        <div class="modal-actions">
          <button class="ghost-btn" id="cancelBtn">キャンセル</button>
          <button class="primary-btn" style="width:auto;background:var(--danger)" id="okBtn">削除する</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  document.getElementById('okBtn').onclick = async ()=>{
    if(entry.hasPhoto) await safeDelete(`photo:${h.id}:${entry.id}`);
    h.entries = h.entries.filter(e=>e.id!==entry.id);
    await saveHamster(h);
    closeModal();
    renderKarte();
    toast('削除しました');
  };
}

/* ---------- init ---------- */
function collectAllData(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  return data;
}
function exportBackup(){
  try{
    const data = collectAllData();
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hamukarte-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('バックアップを書き出しました');
  }catch(e){
    toast('バックアップの書き出しに失敗しました');
  }
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      Object.entries(data).forEach(([k,v])=>{
        if(typeof v === 'string') localStorage.setItem(k, v);
      });
      toast('復元しました。再読み込みします');
      setTimeout(()=>location.reload(), 900);
    }catch(e){
      toast('復元に失敗しました。ファイルを確認してください');
    }
  };
  reader.readAsText(file);
}
function openBackupModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <h3 class="display">バックアップ</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;">
          この端末のデータをファイルに書き出して保存できます。機種変更やデータが消えてしまった時は、書き出したファイルから復元してください。
        </p>
        <div class="field">
          <label>バックアップを書き出す</label>
          <button class="ghost-btn" id="exportBtn" style="width:100%;">ファイルに保存する</button>
        </div>
        <div class="field">
          <label>バックアップから復元する</label>
          <label for="importInput" class="ghost-btn" style="display:block; width:100%; text-align:center; box-sizing:border-box;">ファイルを選んで復元</label>
          <input type="file" id="importInput" accept="application/json">
        </div>
        <div class="modal-actions">
          <button class="ghost-btn" id="closeBackupBtn">閉じる</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeBackupBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('importInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importBackupFile(file);
  };
}
document.getElementById('backupBtn').onclick = openBackupModal;

(async function init(){
  document.getElementById('karte').innerHTML = `<div class="empty-state">読み込み中…</div>`;
  await loadIndex();
  renderAvatarStrip();
  if(hamsterIndex.length){
    await selectHamster(hamsterIndex[0].id);
  } else {
    renderKarte();
  }
})();
</script>
